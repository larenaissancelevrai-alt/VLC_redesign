name: Build & Release

# Pour publier une mise à jour :  git tag v1.0.1  &&  git push origin v1.0.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Injecter la version du tag dans version.py
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content version.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content version.py -Encoding utf8
          Get-Content version.py

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compiler avec PyInstaller
        run: pyinstaller VLC_Redesign.spec --noconfirm --clean

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer.iss

      - name: Archive portable
        shell: pwsh
        run: Compress-Archive -Path "dist\VLC Redesign\*" -DestinationPath "Output\VLC_Redesign_portable.zip"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/VLC_Redesign_Setup.exe
            Output/VLC_Redesign_portable.zip
          generate_release_notes: true
